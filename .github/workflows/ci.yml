name: Angular CI/CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ✅ Génération safe du fichier Angular environment
      - name: Generate environment.prod.ts
        shell: bash
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.prod.ts <<'EOF'
          export const environment = {
            production: true,
            supabaseUrl: '${{ vars.VITE_SUPABASE_URL }}',
            supabaseAnonKey: '${{ vars.VITE_SUPABASE_ANON_KEY }}'
          };
          EOF

      - name: Build Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/dist/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
